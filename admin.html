<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin | RSM Business Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
<style>
  .drawer { position: fixed; inset: 0; background: rgba(0,21,61,.45); z-index: 60; display: flex; justify-content: flex-end; }
  .drawer-inner { background: #fff; width: min(720px, 100%); height: 100%; overflow-y: auto; padding: 26px; }
  #publishBar { display: flex; align-items: center; gap: 14px; }
</style>
</head>
<body>
<main class="wrap">
  <div class="page-head">
    <div class="row-between">
      <div><h1>Admin</h1><div class="muted small">CompanyStore.IO console</div></div>
      <div id="publishBar"></div>
    </div>
  </div>

  <div class="panel hidden" id="gate">
    <h2>Admin access</h2>
    <form id="gateForm" style="max-width:360px">
      <label class="field"><span>Admin password</span>
        <input type="password" id="apass" required autocomplete="current-password"></label>
      <button class="btn" type="submit">Unlock</button>
    </form>
  </div>

  <div id="app" class="hidden">
    <div class="filters" id="adminTabs"></div>
    <div id="panel"></div>
  </div>
</main>

<script src="assets/js/app.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
