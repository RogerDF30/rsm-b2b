<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin | RSM Business Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
<style>
  .drawer { position: fixed; inset: 0; background: rgba(0,21,61,.45); z-index: 60; display: flex; justify-content: flex-end; }
  .drawer-inner { background: #fff; width: min(720px, 100%); height: 100%; overflow-y: auto; padding: 26px; }
  #publishBar { display: flex; align-items: center; gap: 14px; }

  /* --- related products: selected strip -------------------------------- */
  .rel-strip { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); }
  .rel-tile { position: relative; border: 1px solid var(--line, #E3E7EF); border-radius: 10px;
              padding: 8px; background: #fff; text-align: center; }
  .rel-tile img { width: 100%; height: 78px; object-fit: contain; background: var(--off, #F5F7FA);
                  border-radius: 6px; display: block; }
  .rel-name { font-size: 12px; font-weight: 600; margin-top: 6px; line-height: 1.25;
              display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .rel-sku { font-size: 11px; color: var(--muted, #6B7385); margin-top: 2px; }
  .rel-x { position: absolute; top: -8px; right: -8px; width: 24px; height: 24px; border-radius: 50%;
           border: 1px solid var(--line, #E3E7EF); background: #fff; color: #D93025; cursor: pointer;
           font-size: 12px; line-height: 1; box-shadow: 0 1px 4px rgba(0,21,61,.18); }
  .rel-x:hover { background: #D93025; color: #fff; border-color: #D93025; }

  /* --- related products: picker modal ---------------------------------- */
  .modal { position: fixed; inset: 0; background: rgba(0,21,61,.5); z-index: 90;
           display: flex; align-items: center; justify-content: center; padding: 24px; }
  .modal-inner { background: #fff; border-radius: 14px; padding: 22px;
                 width: min(980px, 100%); max-height: 90vh; display: flex; flex-direction: column; }
  .modal-inner .pick-grid { flex: 1; overflow-y: auto; }
  .pick-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
               padding: 4px; }
  .pick-tile { position: relative; border: 2px solid var(--line, #E3E7EF); border-radius: 10px;
               padding: 10px; background: #fff; cursor: pointer; text-align: center;
               font: inherit; display: block; }
  .pick-tile:hover { border-color: #9AA6BE; }
  .pick-tile.on { border-color: var(--brand, #009CDE); box-shadow: 0 0 0 3px rgba(0,156,222,.18); }
  .pick-tile img { width: 100%; height: 96px; object-fit: contain; background: var(--off, #F5F7FA);
                   border-radius: 6px; display: block; }
  .pick-name { display: block; font-size: 12px; font-weight: 600; margin-top: 8px; line-height: 1.25;
               -webkit-line-clamp: 2; -webkit-box-orient: vertical; display: -webkit-box; overflow: hidden; }
  .pick-sku { display: block; font-size: 11px; color: var(--muted, #6B7385); margin-top: 3px; }
  .pick-mark { position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 50%;
               background: var(--brand, #009CDE); color: #fff; font-size: 13px; line-height: 22px;
               display: none; }
  .pick-tile.on .pick-mark { display: block; }
</style>
</head>
<body>
<main class="wrap">
  <div class="page-head">
    <div class="row-between">
      <div><h1>Admin</h1><div class="muted small">CompanyStore.IO console</div></div>
      <div id="publishBar"></div>
    </div>
  </div>

  <div class="panel hidden" id="gate">
    <h2>Admin access</h2>
    <form id="gateForm" style="max-width:360px">
      <label class="field"><span>Admin password</span>
        <input type="password" id="apass" required autocomplete="current-password"></label>
      <button class="btn" type="submit">Unlock</button>
    </form>
  </div>

  <div id="app" class="hidden">
    <div class="filters" id="adminTabs"></div>
    <div id="panel"></div>
  </div>
</main>

<script src="assets/js/app.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
