<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>RSM Business Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<main>
  <section id="hero"></section>

  <div class="wrap">
    <div id="banners"></div>
    <div class="cat-grid" id="cats"></div>

    <div class="row-between" style="margin:36px 0 16px">
      <h2>Featured</h2>
      <a class="link-quiet" href="category.html?cat=Apparel">Browse all</a>
    </div>
    <div class="grid" id="featured"></div>
  </div>
</main>

<script src="assets/js/app.js"></script>
<script>
(async function () {
  await Catalog.load();
  mount();
  paintHero();
  paintBanners();

  const counts = {};
  for (const p of Catalog.products) counts[p.category] = (counts[p.category] || 0) + 1;

  document.getElementById('cats').append(...Catalog.categories.map(c =>
    el('a', { class: 'cat-card', href: 'category.html?cat=' + encodeURIComponent(c.slug) },
      el('h3', {}, c.label),
      el('div', { class: 'small' }, `${counts[c.slug] || 0} products`),
      el('div', { class: 'small muted', style: 'margin-top:8px' }, c.subcategories.join(' · ')))));

  // One representative product per subcategory, cheapest first, capped at 8.
  const seen = new Set(), picks = [];
  for (const p of [...Catalog.products].sort((a, b) => b.base_price - a.base_price)) {
    if (seen.has(p.subcategory)) continue;
    seen.add(p.subcategory);
    picks.push(p);
    if (picks.length === 8) break;
  }
  document.getElementById('featured').append(...picks.map(productCard));
})();

/* First active banner is the hero. Falls back to the settings copy, then to
   hard-coded text, so the page never renders empty. */
function paintHero() {
  const b = Site.banners[0];
  const host = document.getElementById('hero');
  host.className = 'hero';
  if (b && b.image_url) {
    host.style.backgroundImage =
      `linear-gradient(rgba(0,21,61,.72), rgba(0,21,61,.72)), url(${b.image_url})`;
    host.style.backgroundSize = 'cover';
    host.style.backgroundPosition = 'center';
  }
  host.append(el('div', { class: 'wrap' },
    el('img', { class: 'hero-logo', alt: 'RSM',
      src: Site.get('logo_white_url', 'assets/brand/rsm-logo-white.png') }),
    el('h1', {}, (b && b.title) || Site.get('hero_title', 'RSM branded merchandise')),
    el('p', {}, (b && b.subtitle) || Site.get('hero_subtitle',
      'Browse the approved catalogue. Sign in at checkout to raise an order for approval.')),
    b && b.link_url
      ? el('a', { class: 'btn', href: b.link_url, style: 'margin-top:18px' }, 'Browse')
      : null));
}

/* Any banners after the first render as a promo row. */
function paintBanners() {
  const rest = Site.banners.slice(1);
  const host = document.getElementById('banners');
  if (!rest.length) return;
  host.className = 'promo-grid';
  host.append(...rest.map(b => el('a', {
    class: 'promo', href: b.link_url || '#',
    style: b.image_url ? `background-image:linear-gradient(rgba(0,21,61,.55),rgba(0,21,61,.55)),url(${b.image_url})` : '',
  }, el('div', {}, el('h3', {}, b.title || ''), el('p', { class: 'small' }, b.subtitle || '')))));
}
</script>
</body>
</html>
